<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blockbench LowPoly — Motion Showcase</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #05050d;
    color: #fff;
    overflow: hidden;
    height: 100vh; width: 100vw;
  }
  .stage {
    position: relative; width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  /* background gradient mesh */
  .bg {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 20% 30%, #2a0f3d 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, #0f1f3d 0%, transparent 50%),
                #05050d;
  }
  .bg::after {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,0.015) 3px 4px);
  }

  /* Scene base */
  .scene {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .scene.show { opacity: 1; pointer-events: auto; }

  /* ---- Scene 1: Hook ---- */
  #s-hook { gap: 10px; }
  .hook-kicker {
    font-size: 18px; letter-spacing: 6px; color: #ff4d8d; font-weight: 700;
    opacity: 0; transform: translateY(20px);
  }
  .hook-title {
    font-size: clamp(48px, 8vw, 110px); font-weight: 900; line-height: 0.95;
    text-align: center;
    opacity: 0; transform: translateY(40px);
  }
  .hook-title .grad {
    background: linear-gradient(90deg, #ff4d8d, #7c3aed, #3b82f6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hook-sub {
    font-size: 22px; color: #9a9ab0; margin-top: 16px;
    opacity: 0; transform: translateY(20px);
  }
  .scene.show .hook-kicker { animation: rise 0.6s 0.2s forwards; }
  .scene.show .hook-title { animation: rise 0.8s 0.4s forwards; }
  .scene.show .hook-sub { animation: rise 0.6s 0.9s forwards; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  /* ---- Scene 2: input ---- */
  #s-input { gap: 20px; }
  .input-card {
    width: min(780px, 82vw);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    padding: 20px 24px;
    display: flex; align-items: center; gap: 14px;
    backdrop-filter: blur(8px);
    opacity: 0; transform: scale(0.94);
  }
  .scene.show .input-card { animation: pop 0.6s 0.2s forwards; }
  @keyframes pop { to { opacity: 1; transform: scale(1); } }
  .input-text { flex: 1; font-size: 20px; color: #e8e8f0; min-height: 28px; }
  .caret { display: inline-block; width: 2px; height: 24px; background: #ff4d8d; animation: blink 1s steps(2) infinite; vertical-align: middle; }
  @keyframes blink { 50% { opacity: 0; } }
  .send-btn {
    background: #ff4d8d; border: none; color: #fff;
    padding: 12px 22px; border-radius: 12px; font-weight: 700; font-size: 15px;
  }
  .send-btn.pressed { transform: scale(0.9); background: #c93a6e; }
  .input-hint { color: #666; font-size: 13px; opacity: 0; }
  .scene.show .input-hint { animation: rise 0.5s 0.6s forwards; }

  /* ---- Scene 3: working ---- */
  #s-work { gap: 24px; }
  .work-title { font-size: 26px; font-weight: 700; color: #c9c9d4; }
  .work-sub { font-size: 14px; color: #666; font-family: monospace; }
  .ring {
    width: 72px; height: 72px;
    border: 4px solid rgba(255,255,255,0.1);
    border-top-color: #ff4d8d;
    border-right-color: #7c3aed;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress { width: min(460px, 70vw); height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
  .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ff4d8d, #7c3aed, #3b82f6); transition: width 0.4s; }
  .work-log { font-family: monospace; font-size: 13px; color: #888; min-height: 20px; }

  /* ---- Scene 4: showcase ---- */
  #s-show { }
  .show-title {
    position: absolute; top: 8vh; left: 50%; transform: translateX(-50%);
    font-size: 32px; font-weight: 800; letter-spacing: 2px;
    opacity: 0;
  }
  .scene.show .show-title { animation: rise 0.6s 0.1s forwards; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    width: min(900px, 88vw);
    margin-top: 6vh;
  }
  .mcard {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    opacity: 0; transform: scale(0.8) translateY(20px);
    transition: opacity 0.5s, transform 0.5s;
  }
  .mcard.show { opacity: 1; transform: scale(1) translateY(0); }
  .mcard img {
    width: 100%; aspect-ratio: 1/1; object-fit: contain;
    border-radius: 12px; background: #0a0a14;
  }
  .mcard span {
    font-size: 14px; color: #c9c9d4; text-transform: capitalize; font-weight: 600;
  }

  /* ---- Scene 5: endcard ---- */
  #s-end { gap: 18px; text-align: center; }
  .end-kicker { font-size: 16px; letter-spacing: 5px; color: #ff4d8d; font-weight: 700; opacity: 0; }
  .end-title {
    font-size: clamp(52px, 9vw, 120px); font-weight: 900; line-height: 0.9;
    opacity: 0; transform: translateY(30px);
  }
  .end-title .grad {
    background: linear-gradient(90deg, #ff4d8d, #7c3aed);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .end-sub { font-size: 22px; color: #9a9ab0; opacity: 0; }
  .end-cta {
    margin-top: 24px;
    background: #ff4d8d; color: #fff; text-decoration: none;
    padding: 18px 48px; border-radius: 16px;
    font-size: 24px; font-weight: 800;
    box-shadow: 0 12px 40px rgba(255,77,141,0.45);
    opacity: 0; transform: scale(0.9);
    display: inline-block;
  }
  .end-pix {
    margin-top: 18px; font-size: 14px; color: #666;
    opacity: 0;
  }
  .end-pix code {
    background: rgba(255,255,255,0.06); padding: 4px 10px; border-radius: 6px;
    color: #c9c9d4; font-family: monospace;
  }
  .scene.show .end-kicker { animation: rise 0.5s 0.1s forwards; }
  .scene.show .end-title { animation: rise 0.7s 0.3s forwards; }
  .scene.show .end-sub { animation: rise 0.6s 0.7s forwards; }
  .scene.show .end-cta { animation: pop 0.6s 0.9s forwards; }
  .scene.show .end-pix { animation: rise 0.5s 1.2s forwards; }

  /* all-models strip */
  .strip {
    position: absolute; bottom: 6vh; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px;
    opacity: 0;
  }
  .scene.show .strip { animation: rise 0.6s 1.4s forwards; }
  .strip img {
    width: 64px; height: 64px; object-fit: contain; border-radius: 8px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="bg"></div>

  <!-- Scene 1 -->
  <div id="s-hook" class="scene show">
    <div class="hook-kicker">BLOCKBENCH LOWPOLY</div>
    <div class="hook-title">FORGE <span class="grad">3D ASSETS</span><br>FROM CODE</div>
    <div class="hook-sub">No Blender. No editor. Pure Python.</div>
  </div>

  <!-- Scene 2 -->
  <div id="s-input" class="scene">
    <div class="input-card">
      <div class="input-text" id="typed"></div><span class="caret"></span>
      <button class="send-btn" id="sendBtn">Send</button>
    </div>
    <div class="input-hint">describe what you want to build…</div>
  </div>

  <!-- Scene 3 -->
  <div id="s-work" class="scene">
    <div class="ring"></div>
    <div class="work-title" id="workTitle">Agent is working…</div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    <div class="work-log" id="workLog">parsing prompt</div>
  </div>

  <!-- Scene 4 -->
  <div id="s-show" class="scene">
    <div class="show-title">MODELS FORGED</div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- Scene 5 -->
  <div id="s-end" class="scene">
    <div class="end-kicker">OPENCODE PLUGIN</div>
    <div class="end-title">TRY <span class="grad">NOW</span></div>
    <div class="end-sub">github.com/vpnkkpo-lgtm/opencode-blockbench-lowpoly</div>
    <a class="end-cta" href="https://github.com/vpnkkpo-lgtm/opencode-blockbench-lowpoly" target="_blank">Get the plugin →</a>
    <div class="end-pix">Pix: <code>vpnkkpo@gmail.com</code></div>
    <div class="strip" id="strip"></div>
  </div>
</div>

const names = ["sapo", "abelha corrompida", "pinguim gorro", "garrafa agua", "zumbi", "fuzil ak47"];

const sHook = document.getElementById("s-hook");
const sInput = document.getElementById("s-input");
const sWork = document.getElementById("s-work");
const sShow = document.getElementById("s-show");
const sEnd = document.getElementById("s-end");

function show(el) {
  document.querySelectorAll(".scene").forEach(s => s.classList.remove("show"));
  el.classList.add("show");
}

// Scene 1 -> 2
setTimeout(() => {
  show(sInput);
  typeChar();
}, 3200);

const typed = document.getElementById("typed");
const sendBtn = document.getElementById("sendBtn");
let idx = 0;
function typeChar() {
  if (idx < phrase.length) {
    typed.textContent += phrase[idx];
    idx++;
    setTimeout(typeChar, 55 + Math.random()*35);
  } else {
    setTimeout(pressSend, 700);
  }
}
function pressSend() {
  sendBtn.classList.add("pressed");
  setTimeout(() => {
    show(sWork);
    runWork();
  }, 400);
}

const steps = [
  ["parsing prompt", "understanding request"],
  ["planning silhouette", "proportions & tri budget"],
  ["building geometry", "Model.cube / bevel_box"],
  ["painting texture", "Canvas.panel / spot / eyes"],
  ["validating", "bbcheck --style → 0 errors"],
  ["rendering previews", "bbrender.render_sheet"],
  ["exporting", ".bbmodel + .glb + link.txt"],
];
function runWork() {
  const title = document.getElementById("workTitle");
  const log = document.getElementById("workLog");
  const bar = document.getElementById("progressBar");
  let i = 0;
  function next() {
    if (i >= steps.length) {
      setTimeout(showShow, 500);
      return;
    }
    title.textContent = steps[i][0] + "…";
    log.textContent = steps[i][1];
    bar.style.width = ((i+1)/steps.length*100) + "%";
    i++;
    setTimeout(next, 650);
  }
  next();
}

function showShow() {
  show(sShow);
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  imgs.forEach((src, i) => {
    const card = document.createElement("div");
    card.className = "mcard";
    card.innerHTML = `<img src="${src}" alt="${names[i]}"><span>${names[i]}</span>`;
    grid.appendChild(card);
    setTimeout(() => card.classList.add("show"), 200 + i*180);
  });
  setTimeout(showEnd, 200 + imgs.length*180 + 1800);
}

function showEnd() {
  show(sEnd);
  const strip = document.getElementById("strip");
  strip.innerHTML = "";
  imgs.forEach(src => {
    const t = document.createElement("img");
    t.src = src;
    strip.appendChild(t);
  });
}

// loop: restart after 6s on endcard
setTimeout(() => {}, 0);
</script>
